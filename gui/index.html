<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nous Intelligence</title>
<link rel="icon" type="image/svg+xml" href="/gui/icon.svg"/>
<style>
:root {
  --accent: #E4D329;
  --bg: #12121A;
  --panel: #1E1E2A;
  --panel-2: #22222E;
  --chat-bg: #181825;
  --ai-msg-bg: #26263A;
  --bar-bg: #2D2D42;
  --input-bg: #2A2A3A;
  --btn-bg: #3A3A4A;
  --btn-bg-hover: #4A4A5A;
  --border: #3A3A4A;
  --border-soft: rgba(222,222,217,0.15);
  --text: #deded9;
  --text-muted: #5a5a6a;
  --text-label: #b0b0ba;
  --terminal-bg: #0d0d12;
  --terminal-text: #a8e6a3;
  --console-text: #c9d1d9;
  --success: #2ecc71;
  --success-hover: #27ae60;
  --shadow: rgba(0,0,0,0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--bg);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Initialize Screen ── */
.init-screen {
  position: fixed;
  inset: 0;
  z-index: 1100;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.6s ease;
}

.init-screen.hidden {
  opacity: 0;
  pointer-events: none;
}

.init-screen .init-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 34px;
  text-align: center;
}

.init-screen .init-title {
  color: #deded9;
  font-size: 30px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.init-screen #btnInitialize {
  background: #000;
  border: 1px solid #8b5cf6;
  border-radius: 12px;
  padding: 14px 48px;
  font-size: 17px;
  font-weight: 600;
  color: #a78bfa;
  cursor: pointer;
  letter-spacing: 1px;
  box-shadow: 0 0 14px rgba(139,92,246,0.6), inset 0 0 10px rgba(139,92,246,0.25);
  transition: box-shadow 0.2s, transform 0.2s, color 0.2s;
}

.init-screen #btnInitialize:hover {
  color: #c4b5fd;
  box-shadow: 0 0 22px rgba(139,92,246,0.9), inset 0 0 14px rgba(139,92,246,0.4);
  transform: translateY(-1px);
}

/* ── Splash Screen ── */
.splash-screen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.6s ease;
}

.splash-screen.hidden {
  opacity: 0;
  pointer-events: none;
}

.splash-screen img {
  width: 78%;
  max-width: 760px;
  opacity: 0;
  animation: splash-grow 2.6s ease-out forwards;
}

@keyframes splash-grow {
  0%   { transform: scale(0.55); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* ── Background Blurs ── */
.bg-blurs {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.blur-spot {
  position: absolute;
  border-radius: 50%;
  opacity: 0.3;
  filter: blur(120px);
  animation: drift 8s ease-in-out infinite alternate;
}

.blur-spot:nth-child(2) { animation-duration: 10s; animation-delay: -2s; }
.blur-spot:nth-child(3) { animation-duration: 7s; animation-delay: -4s; }
.blur-spot:nth-child(4) { animation-duration: 9s; animation-delay: -1s; }
.blur-spot:nth-child(5) { animation-duration: 11s; animation-delay: -3s; }

@keyframes drift {
  0% { transform: translateY(0); }
  100% { transform: translateY(40px); }
}

/* ── Floating Top Bar ── */
.floating-bar {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  z-index: 100;
  background: var(--bar-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 5px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  backdrop-filter: blur(12px);
}

.floating-bar .bar-logo {
  height: 22px;
  overflow: hidden;
  display: inline-flex;
  align-items: flex-start;
}

.floating-bar .bar-logo img {
  height: 31px;
  width: auto;
  transform: translateY(-1px);
  filter: drop-shadow(0 0 6px rgba(1,120,172,0.35));
}

.floating-bar .bar-buttons {
  display: flex;
  gap: 6px;
}

.floating-bar .bar-buttons button {
  background: transparent;
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  padding: 4px;
  cursor: pointer;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.2s;
}

.floating-bar .bar-buttons button:hover {
  border-color: var(--accent);
}

.floating-bar .bar-buttons button.active {
  border-color: var(--accent);
  color: var(--accent);
}

.floating-bar #btnGithub {
  background: transparent;
  border: none;
  border-radius: 8px;
  padding: 4px;
  cursor: pointer;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s;
}

.floating-bar #btnGithub:hover {
  border: none;
  color: var(--accent);
}

.floating-bar #btnGithub svg {
  width: 20px;
  height: 20px;
}

.floating-bar .bar-buttons button svg {
  width: 20px;
  height: 20px;
}

/* ── Main Layout ── */
.main {
  display: flex;
  position: relative;
  z-index: 1;
  gap: 20px;
  padding: 68px 20px 20px;
  flex: 1;
  min-height: 0;
}

/* ── Side Stack (chat + terminal) ── */
.side-stack {
  flex: 0 0 auto;
  width: 400px;
  min-width: 280px;
  max-width: 700px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-height: 0;
}

/* ── Chat Panel ── */
.chat-panel {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  background: var(--panel);
  border-radius: 16px;
  border: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

#btnClearChat {
  position: absolute;
  top: 10px;
  right: 16px;
  z-index: 5;
  background: rgba(42,42,58,0.85);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px 12px;
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
}

#btnClearChat:hover {
  color: var(--text);
  border-color: var(--accent);
}

.resize-handle {
  position: absolute;
  top: 0;
  right: 0;
  width: 6px;
  height: 100%;
  cursor: ew-resize;
  z-index: 10;
}

.resize-handle::after {
  content: '';
  position: absolute;
  top: 50%;
  right: 1px;
  width: 3px;
  height: 40px;
  background: var(--border);
  border-radius: 2px;
  transform: translateY(-50%);
  transition: background 0.2s;
}

.resize-handle:hover::after,
.resize-handle.active::after {
  background: var(--accent);
}

.chat-messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
  background: var(--chat-bg);
}

.chat-messages .placeholder {
  color: var(--text-muted);
  text-align: center;
  margin: auto;
  font-style: italic;
  font-size: 14px;
}

.chat-messages .msg {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.4;
  word-wrap: break-word;
  white-space: pre-wrap;
}

.chat-messages .ai-msg {
  align-self: flex-start;
  background: var(--ai-msg-bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 14px 14px 14px 4px;
}

.chat-input-area {
  padding: 12px 16px 16px;
  display: flex;
  gap: 10px;
  border-top: 1px solid var(--border);
}

.chat-input-area textarea {
  flex: 1;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--input-bg);
  font-size: 14px;
  font-family: inherit;
  line-height: 1.4;
  outline: none;
  color: var(--text);
  resize: none;
  max-height: 120px;
  overflow-y: auto;
}

.chat-input-area textarea::placeholder {
  color: var(--text-muted);
}

.chat-input-area textarea:focus {
  border-color: var(--accent);
}

.chat-input-area button {
  background: var(--border);
  border: none;
  border-radius: 10px;
  padding: 10px 12px;
  cursor: pointer;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  transition: background 0.2s;
}

.chat-input-area button:hover {
  background: var(--btn-bg-hover);
}

.chat-input-area button svg {
  width: 20px;
  height: 20px;
  color: var(--text);
}

/* ── Camera Panel ── */
.camera-panel {
  flex: 1;
  background: var(--panel);
  border-radius: 16px;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  transition: flex 0.3s, min-width 0.3s, max-width 0.3s, border-color 0.3s;
}

#cameraFeed.contain {
  object-fit: contain;
}

.btn-camera-off {
  opacity: 0.35;
}

#cameraFeed {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

#cameraFeed.active {
  display: block;
}

.camera-placeholder {
  text-align: center;
  color: var(--text-muted);
}

.camera-placeholder.hidden {
  display: none;
}

.camera-placeholder svg {
  width: 48px;
  height: 48px;
  margin-bottom: 10px;
  opacity: 0.5;
}

.camera-placeholder p {
  font-size: 14px;
}

/* ── Status Dot ── */
.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #e74c3c;
  box-shadow: 0 0 6px #e74c3c;
  display: inline-block;
  margin-left: 10px;
  transition: background 0.3s, box-shadow 0.3s;
}

.status-dot.starting {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

.status-dot.online {
  background: #00ff88;
  box-shadow: 0 0 8px #00ff88;
}

/* ── Settings Panel ── */
.settings-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
}

.settings-overlay.open {
  display: flex;
}

.settings-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 780px;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.settings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 16px;
  color: var(--text);
}

.settings-header button {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 22px;
  cursor: pointer;
}

.settings-header button:hover {
  color: var(--text);
}

.settings-tabs {
  display: flex;
  gap: 4px;
  padding: 12px 16px 0;
  overflow-x: auto;
  flex-shrink: 0;
}

.settings-tabs .tab {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 6px 10px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 11px;
  white-space: nowrap;
  transition: color 0.2s, border-color 0.2s;
}

.settings-tabs .tab:hover {
  color: var(--text);
}

.settings-tabs .tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.settings-body {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}

.tab-content {
  display: none;
  flex-direction: column;
  gap: 14px;
}

.tab-content.active {
  display: flex;
}

.tab-content label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--text-label);
  gap: 12px;
}

.tab-content label input[type="text"],
.tab-content label input[type="number"],
.tab-content label select {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  color: var(--text);
  font-size: 13px;
  width: 180px;
  outline: none;
}

.tab-content label input[type="text"]:focus,
.tab-content label input[type="number"]:focus,
.tab-content label select:focus {
  border-color: var(--accent);
}

.tab-content label input[type="checkbox"] {
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
}

.tab-content label input[type="range"] {
  width: 140px;
  accent-color: var(--accent);
}

.tab-content .path-row {
  display: flex;
  gap: 4px;
  align-items: center;
  width: 180px;
  flex-shrink: 0;
}

.tab-content .path-row input[type="text"] {
  flex: 1;
  min-width: 0;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  color: var(--text);
  font-size: 13px;
  outline: none;
}

.tab-content .path-row input[type="text"]:focus {
  border-color: var(--accent);
}

.tab-content .path-row button {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}

.tab-content .path-row button:hover {
  border-color: var(--accent);
}

.tab-content label.disabled {
  opacity: 0.35;
  pointer-events: none;
}

.tab-content label input[type="color"] {
  width: 40px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: none;
  cursor: pointer;
}

.tab-content label.textarea-field {
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
}

.tab-content label.textarea-field textarea {
  width: 100%;
  height: 120px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  color: var(--text);
  font-size: 13px;
  font-family: Consolas, Menlo, monospace;
  resize: vertical;
  outline: none;
}

.tab-content label.textarea-field textarea:focus {
  border-color: var(--accent);
}

.settings-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
}

.settings-footer button {
  background: var(--success);
  border: none;
  border-radius: 8px;
  padding: 8px 24px;
  font-weight: 600;
  font-size: 14px;
  color: #fff;
  cursor: pointer;
  transition: background 0.2s;
}

.settings-footer button:hover {
  background: var(--success-hover);
}

/* ── Toast Notification ── */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 600;
  background: var(--bg);
  border: 1px solid var(--success);
  color: var(--success);
  padding: 12px 22px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  box-shadow: 0 6px 20px var(--shadow);
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

.toast .loader {
  display: none;
}

.toast.busy {
  border-color: var(--border);
  color: var(--text);
}

.toast.busy .loader {
  display: inline-block;
}

/* Spinner loader (shown beside "Generating..." messages) */
.loader {
  --color-1: #A7E0E9;
  --color-2: #2F4EC6;
  --size: 0.6px;

  width: calc(48 * var(--size));
  height: calc(48 * var(--size));
  border-radius: 50%;
  display: inline-block;
  position: relative;
  border: calc(3 * var(--size)) solid;
  border-color: var(--color-1) var(--color-1) transparent;
  box-sizing: border-box;
  animation: rotation 1s linear infinite;
  flex-shrink: 0;
}

.loader::after {
  content: '';
  box-sizing: border-box;
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
  margin: auto;
  border: calc(3 * var(--size)) solid;
  border-color: transparent var(--color-2) var(--color-2);
  width: calc(24 * var(--size));
  height: calc(24 * var(--size));
  border-radius: 50%;
  animation: rotationBack 0.5s linear infinite;
  transform-origin: center center;
}

@keyframes rotation {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes rotationBack {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(-360deg); }
}

/* Three-dots loader (shown in the chat bubble while generating) */
.typing-dots {
  display: inline-block;
  width: 60px;
  aspect-ratio: 4;
  --_g: no-repeat radial-gradient(circle closest-side,var(--text) 90%,#0000);
  background:
    var(--_g) 0%   50%,
    var(--_g) 50%  50%,
    var(--_g) 100% 50%;
  background-size: calc(100%/3) 100%;
  animation: l7 1s infinite linear;
}

@keyframes l7 {
  33% { background-size: calc(100%/3) 0%,   calc(100%/3) 100%, calc(100%/3) 100%; }
  50% { background-size: calc(100%/3) 100%, calc(100%/3) 0%,   calc(100%/3) 100%; }
  66% { background-size: calc(100%/3) 100%, calc(100%/3) 100%, calc(100%/3) 0%; }
}
/* ── Terminal Panel ── */
.terminal {
  flex: 0 0 auto;
  height: 220px;
  width: 100%;
  background: var(--terminal-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: none;
  flex-direction: column;
  overflow: hidden;
}

.terminal.visible {
  display: flex;
}

.terminal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
}

.terminal-header button {
  background: none;
  border: 1px solid var(--border-soft);
  border-radius: 6px;
  color: var(--text);
  padding: 2px 8px;
  cursor: pointer;
  font-size: 12px;
}

.terminal-header button:hover {
  border-color: var(--accent);
}

.terminal-log {
  flex: 1;
  overflow-y: auto;
  padding: 10px 14px;
  font-family: Consolas, Menlo, monospace;
  font-size: 12px;
  line-height: 1.5;
  color: var(--terminal-text);
  white-space: pre-wrap;
  word-break: break-all;
}

/* ── Warning Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
}

.modal-overlay.open {
  display: flex;
}

.modal-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 420px;
  max-width: 92vw;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.modal-text {
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
}

.modal-actions button {
  background: var(--success);
  border: none;
  border-radius: 8px;
  padding: 8px 24px;
  font-weight: 600;
  font-size: 14px;
  color: #fff;
  cursor: pointer;
  transition: background 0.2s;
}

.modal-actions button:hover {
  background: var(--success-hover);
}

/* ── Init Overlay ── */
.init-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 250;
  display: none;
  align-items: center;
  justify-content: center;
}

.init-overlay.open {
  display: flex;
}

.init-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 640px;
  max-width: 92vw;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.init-panel h3 {
  color: var(--text);
  font-size: 15px;
  font-weight: 600;
}

.init-console {
  background: var(--terminal-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  height: 320px;
  overflow-y: auto;
  padding: 12px 14px;
  font-family: Consolas, Menlo, monospace;
  font-size: 12px;
  line-height: 1.6;
  color: var(--console-text);
  white-space: pre-wrap;

fetch('/api/settings').then(r => r.json()).then(c => {

    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', skipIntro);
    } else {
      skipIntro();
    }
  }
}).catch(() => {});

<script>
// ── Camera Toggle ──
let cameraStream = null;
const btnCamera = document.getElementById('btnCamera');
const cameraSlash = document.getElementById('cameraSlash');

async function startCamera() {
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
    const video = document.getElementById('cameraFeed');
    video.srcObject = cameraStream;
    await video.play();
    video.classList.add('active');
    document.getElementById('cameraPlaceholder').classList.add('hidden');
    btnCamera.style.borderColor = 'var(--accent)';
    cameraSlash.style.display = 'none';
  } catch (err) {
    console.log('Camera not available:', err.message);
  }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  const video = document.getElementById('cameraFeed');
  video.classList.remove('active');
  video.srcObject = null;
  document.getElementById('cameraPlaceholder').classList.remove('hidden');
  btnCamera.style.borderColor = '';
  cameraSlash.style.display = 'block';
}

btnCamera.addEventListener('click', () => {
  if (cameraStream) { stopCamera(); }
  else { startCamera(); }
});

// ── Blur Intensity ──
const blurSlider = document.getElementById('blurIntensity');
const blurSpots = document.querySelectorAll('.blur-spot');
function updateBlur() {
  blurSpots.forEach(spot => { spot.style.filter = `blur(${blurSlider.value}px)`; });
}
blurSlider.addEventListener('input', updateBlur);
updateBlur();

// ── Keep Camera Aspect Ratio ──
const keepAspect = document.getElementById('keepAspect');
const camVideo = document.getElementById('cameraFeed');

keepAspect.addEventListener('change', () => {
  camVideo.classList.toggle('contain', keepAspect.checked);
});

// ── Chat Panel Resize ──
const chatPanel = document.getElementById('chatPanel');
const sideStack = document.getElementById('sideStack');
const resizeHandle = document.getElementById('resizeHandle');
let isResizing = false;

resizeHandle.addEventListener('mousedown', (e) => {
  isResizing = true;
  document.body.style.cursor = 'ew-resize';
  resizeHandle.classList.add('active');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isResizing) return;
  const rect = sideStack.getBoundingClientRect();
  let newWidth = e.clientX - rect.left;
  newWidth = Math.max(280, Math.min(700, newWidth));
  sideStack.style.width = newWidth + 'px';
});

document.addEventListener('mouseup', () => {
  if (isResizing) {
    isResizing = false;
    document.body.style.cursor = '';
    resizeHandle.classList.remove('active');
  }
});

// ── WebSocket ──
let socket = null;
let reconnectTimer = null;

function wsUrl() {
  const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${window.location.host}/ws`;
}

function connectWebSocket() {
  if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
    return;
  }
  socket = new WebSocket(wsUrl());

  socket.onopen = () => {
    console.log('[WS] Conexión establecida con éxito.');
  };

  socket.onmessage = (event) => {
    console.log('[WS] Mensaje recibido del servidor:', event.data);
    try {
      const data = JSON.parse(event.data);
      handleIncomingMessage(data);
    } catch (e) {
      console.error('[WS] No se pudo parsear el mensaje:', e);
    }
  };

  socket.onerror = (error) => {
    console.error('[WS] Error en la conexión:', error);
  };

  socket.onclose = () => {
    console.warn('[WS] Conexión cerrada. Intentando reconectar en 3 segundos...');
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connectWebSocket, 3000);
  };
}

function wsSend(type, payload, quiet = false) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    const messageObject = {
      type: type,
      payload: payload,
      timestamp: Date.now()
    };
    socket.send(JSON.stringify(messageObject));
    if (!quiet) console.log(`[WS Enviado] (${type}):`, payload);
  } else {
    if (!quiet) console.error('[WS Error] No se pudo enviar el mensaje: La conexión no está abierta.');
    connectWebSocket();
  }
}

function setServiceStatus(status) {
  // status: 'off' (red) | 'starting' (yellow) | 'online' (green)
  const statusDot = document.getElementById('statusDot');
  if (!statusDot) return;
  statusDot.classList.remove('starting', 'online');
  if (status === 'starting') statusDot.classList.add('starting');
  else if (status === 'online') statusDot.classList.add('online');
}

// ── Init panel / terminal logging ──
const initOverlay = document.getElementById('initOverlay');
const initConsole = document.getElementById('initConsole');
const terminalLog = document.getElementById('terminalLog');

// Renders ANSI color codes (\x1b[31m, etc.) as colored spans for the web terminal.
const ANSI_COLORS = {
  30: '#000000', 31: '#ff5555', 32: '#50fa7b', 33: '#f1fa8c',
  34: '#8be9fd', 35: '#ff79c6', 36: '#4ad2d2', 37: '#f8f8f2',
  90: '#777777', 91: '#ff6e6e', 92: '#69ff94', 93: '#ffffa5',
  94: '#d6acff', 95: '#ff92df', 96: '#a4ffff', 97: '#ffffff'
};

function ansiToHtml(line) {
  line = String(line).replace(/\r/g, '');
  const escaped = line
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const re = /\x1b\[([0-9;]*)m/g;
  let out = '';
  let cur = null;
  let last = 0;
  let m;
  while ((m = re.exec(escaped)) !== null) {
    out += escaped.slice(last, m.index);
    last = re.lastIndex;
    const seq = m[1] ? m[1].split(';') : ['0'];
    let next = cur;
    for (const c of seq) {
      if (c === '0' || c === '') next = null;
      else if (c === '38') next = '#FFA500'; // orange used by the codebase
      else if (ANSI_COLORS[c]) next = ANSI_COLORS[c];
    }
    if (next !== cur) {
      if (cur) out += '</span>';
      if (next) out += `<span style="color:${next};">`;
      cur = next;
    }
  }
  out += escaped.slice(last);
  if (cur) out += '</span>';
  return out;
}

function appendLog(line) {
  const raw = String(line);
  const html = ansiToHtml(raw);
  if (terminalLog) {
    terminalLog.innerHTML += html + '\n';
    terminalLog.scrollTop = terminalLog.scrollHeight;
  }
  if (initOverlay && initOverlay.classList.contains('open') && initConsole) {
    initConsole.innerHTML += html + '\n';
    initConsole.scrollTop = initConsole.scrollHeight;
  }
  if (raw.indexOf('All requested AI services are online') !== -1) {
    showInitOk();
  }
}

function hideSplash() {
  if (!splashScreen || splashScreen.classList.contains('hidden')) return;
  splashScreen.classList.add('hidden');
  setTimeout(() => { splashScreen.style.display = 'none'; }, 700);
}

function startSplash() {
  if (!splashScreen) return;
  // Restart the logo tween so it plays from the beginning each time the splash
  // is shown, even if the user lingered on the initialize screen.
  const logo = splashScreen.querySelector('img');
  if (logo) {
    logo.style.animation = 'none';
    void logo.offsetWidth;
    logo.style.animation = '';
  }
  if (initScreen) initScreen.classList.add('hidden');
  // User gesture here lets the browser allow audio playback.
  const audio = new Audio('/gui/Splash-screen.mp3');
  let hidden = false;
  const hideOnce = () => {
    if (hidden) return;
    hidden = true;
    hideSplash();
  };
  audio.addEventListener('ended', hideOnce);
  audio.addEventListener('error', hideOnce);
  audio.play().catch(() => {
    // If audio still fails, keep the splash visible for a moment, then move on.
    setTimeout(hideOnce, 3000);
  });
  // Safety net so the splash never lingers forever.
  setTimeout(hideOnce, 15000);
}

let stagedMsg = null;

function getOrCreateTypingBubble() {
  const msgs = document.getElementById('chatMessages');
  if (!msgs) return null;
  if (stagedMsg && stagedMsg.isConnected) return stagedMsg;
  const bubble = document.createElement('div');
  bubble.className = 'msg ai-msg';
  const dots = document.createElement('span');
  dots.className = 'typing-dots';
  bubble.appendChild(dots);
  msgs.appendChild(bubble);
  msgs.scrollTop = msgs.scrollHeight;
  stagedMsg = bubble;
  return bubble;
}

function replaceTypingBubble(text) {
  const msgs = document.getElementById('chatMessages');
  if (!msgs) return;
  if (stagedMsg && stagedMsg.isConnected) {
    // Replace the typing indicator with the real answer.
    stagedMsg.textContent = text;
    stagedMsg = null;
  } else {
    const bubble = document.createElement('div');
    bubble.className = 'msg ai-msg';
    bubble.textContent = text;
    msgs.appendChild(bubble);
  }
  msgs.scrollTop = msgs.scrollHeight;
}

function handleIncomingMessage(data) {
  if (data.type === 'chat_stage') {
    const stage = data.payload.stage;
    if (stage === 'thinking') {
      // Typing dots bubble + "Generating response" notification.
      getOrCreateTypingBubble();
      showToast('Generating response', { busy: true, duration: 0 });
    } else if (stage === 'voice') {
      showToast('Generating TTS', { busy: true, duration: 0 });
    }
  } else if (data.type === 'chat_response') {
    replaceTypingBubble(data.payload.text);
    // If TTS never started, drop the "Generating response" notification now.
    if (toastMode === 'Generating response') hideToast();
  } else if (data.type === 'tts_done') {
    // Voice playback finished -> drop the "Generating TTS" notification.
    hideToast();
  } else if (data.type === 'log') {
    // Server/uvicorn print forwarded to the init console and terminal.
    appendLog(data.payload.line);
  } else if (data.type === 'speech_result') {
    const text = (data.payload.text || '').trim();
    hideToast();
    if (text) {
      sendChatMessage(text);
    } else {
      showToast('Could not understand audio. Try again.');
    }
  } else if (data.type === 'wake_detected') {
    showToast('Listening...', { duration: 0 });
  } else if (data.type === 'status_update') {
    const running = data.payload.running === true;
    setServiceStatus(running ? 'online' : 'off');
    serviceRunning = running;
    if (data.payload.voice_mode !== undefined) {
      inputService = data.payload.voice_mode || 'console';
      updateInputPlaceholder();
    }
    // Init finished -> let the user close the panel.
    if (running) {
      showInitOk();
      if (inputService === 'wake_word') startWakeStream();
      else if (inputService === 'speech') requestMic();
    } else {
      releaseMic();
    }
  }
}

function bytesToBase64(bytes) {
  let binary = '';
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

async function populateAudioDevices() {
  const select = document.getElementById('audioDeviceSelect');
  if (!select) return;
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const inputs = devices.filter(d => d.kind === 'audioinput');
    const saved = originalSettings?.audio_device || select.value || '';
    select.innerHTML = '<option value="">System Default</option>';
    inputs.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || `Device ${d.deviceId.slice(0, 8)}`;
      select.appendChild(opt);
    });
    select.value = saved;
    console.log('[Mic] Device list:', inputs.length, 'input(s)');
  } catch (err) {
    console.warn('[Mic] Cannot enumerate devices:', err);
  }
}

async function requestMic() {
  if (micStream) return true;
  const select = document.getElementById('audioDeviceSelect');
  const deviceId = select?.value || '';
  try {
    micStream = await navigator.mediaDevices.getUserMedia(
      deviceId ? { audio: { deviceId: { exact: deviceId } } } : { audio: true }
    );
    const track = micStream.getAudioTracks()[0];
    console.log('[Mic] Using:', track?.label, '| muted:', track?.muted, '| enabled:', track?.enabled);
    return true;
  } catch (err) {
    console.warn('[Mic] Access denied or device unavailable:', err);
    showToast('Microphone access denied');
    return false;
  }
}

function ensureAudioContext() {
  // Browsers gate audio on a user gesture: create/resume the context while the
  // key press / click is being handled, or onaudioprocess never fires and no
  // audio is sent to the server.
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  if (!micCtx) {
    try {
      micCtx = new AC({ sampleRate: 16000 });
    } catch (err) {
      micCtx = new AC();
    }
  }
  if (micCtx.state === 'suspended') micCtx.resume();
  return !!micCtx;
}

function startAudioProcessor(onChunk) {
  if (!micStream || micProcessor) return null;
  if (!ensureAudioContext()) return null;
  if (micCtx.state === 'suspended') {
    // Safety net: resume on the next interaction if a browser ignored us.
    const resumeOnGesture = () => {
      if (micCtx && micCtx.state === 'suspended') micCtx.resume();
    };
    document.addEventListener('pointerdown', resumeOnGesture, { once: true });
    document.addEventListener('keydown', resumeOnGesture, { once: true });
  }
  micSource = micCtx.createMediaStreamSource(micStream);
  micProcessor = micCtx.createScriptProcessor(4096, 1, 1);
  // Keep the graph running (so onaudioprocess fires) without audible feedback.
  const mute = micCtx.createGain();
  mute.gain.value = 0;
  micProcessor.onaudioprocess = (e) => {
    const input = e.inputBuffer.getChannelData(0);
    const int16 = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) {
      const s = Math.max(-1, Math.min(1, input[i]));
      int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    onChunk(new Uint8Array(int16.buffer));
  };
  micSource.connect(micProcessor);
  micProcessor.connect(mute);
  mute.connect(micCtx.destination);
  return micCtx.sampleRate || 16000;
}

function stopAudioProcessor() {
  if (micProcessor) {
    try { micProcessor.disconnect(); } catch (e) {}
    micProcessor = null;
  }
  if (micSource) {
    try { micSource.disconnect(); } catch (e) {}
    micSource = null;
  }
}

function releaseMic() {
  speechActive = false;
  wakeStreamActive = false;
  stopAudioProcessor();
  if (micStream) {
    micStream.getTracks().forEach((t) => t.stop());
    micStream = null;
  }
  if (micCtx) {
    micCtx.close().catch(() => {});
    micCtx = null;
  }
}

function setRecordingVisual(on) {
  const input = document.getElementById('chatInput');
  if (!input) return;
  input.style.borderColor = on ? 'var(--accent)' : '';
  if (on) input.placeholder = 'Listening... release Space to send';
  else updateInputPlaceholder();
}

async function startPushToTalk() {
  if (speechActive) return;
  ensureAudioContext();
  const ok = await requestMic();
  if (!ok) return;
  populateAudioDevices();
  speechActive = true;
  setRecordingVisual(true);
  const rate = startAudioProcessor((pcm) => {
    if (speechActive) wsSend('mic', { event: 'audio', data: bytesToBase64(pcm) }, true);
  });
  wsSend('mic', { event: 'init', rate: rate || 16000 });
  wsSend('mic', { event: 'start' });
}

function stopPushToTalk() {
  if (!speechActive) return;
  speechActive = false;
  setRecordingVisual(false);
  stopAudioProcessor();
  wsSend('mic', { event: 'stop' });
}

async function startWakeStream() {
  if (wakeStreamActive) return;
  ensureAudioContext();
  const ok = await requestMic();
  if (!ok) return;
  wakeStreamActive = true;
  const rate = startAudioProcessor((pcm) => {
    if (!wakeStreamActive) return;
    wsSend('mic', { event: 'audio', data: bytesToBase64(pcm) }, true);
  });
  wsSend('mic', { event: 'init', rate: rate || 16000 });
}

function stopWakeStream() {
  wakeStreamActive = false;
  stopAudioProcessor();
}

function ensureVoiceStreamStarted() {
  if (inputService === 'wake_word' && serviceRunning && !wakeStreamActive) {
    startWakeStream();
  }
}

  if (e.key !== ' ' || e.repeat) return;
  if (inputService !== 'speech' || !serviceRunning) return;
  const t = document.activeElement;
  if (t && t !== document.body && t.id !== 'chatInput') return;
  const chatInputEl = document.getElementById('chatInput');
  if (t === chatInputEl && chatInputEl.value.trim().length > 0) return;
  e.preventDefault();
  startPushToTalk();
});

document.addEventListener('keyup', (e) => {
  if (e.key !== ' ') return;
  if (speechActive) {
    e.preventDefault();
    stopPushToTalk();
  }
});

  if (speechActive) stopPushToTalk();
});

function collectChangedSettings() {
  // Only keys that exist in the backend config AND differ get sent on Apply.
  const diff = {};
  document.querySelectorAll('[data-key]').forEach((el) => {
    const key = el.dataset.key;
    if (originalSettings === null || !(key in originalSettings)) return;
    const value = el.type === 'checkbox'
      ? el.checked
      : el.type === 'number'
        ? parseFloat(el.value)
        : el.value;
    if (originalSettings[key] !== value) diff[key] = value;
  });
  return diff;
}

function applySettings() {
  const diff = collectChangedSettings();
  console.log('[POST] /api/settings', diff);
  fetch('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(diff),
  })
    .then((res) => res.json())
    .then((data) => {
      originalSettings = data.config;
      if (data.config && data.config.user_input_service) {
        inputService = data.config.user_input_service;
        updateInputPlaceholder();
      }
      console.log('[POST] settings saved', data.config);
    })
    .catch((err) => console.error('Failed to apply settings', err));
}

document.getElementById('btnSend').addEventListener('click', () => {
  const input = document.getElementById('chatInput');
  sendChatMessage(input.value);
  input.value = '';
});

document.getElementById('chatInput').addEventListener('keydown', (e) => {
  // Enter sends; Alt+Enter (or Shift+Enter) inserts a new line.
  if (e.key === 'Enter' && !e.altKey && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('btnSend').click();
  }
});

// Set the status dot from the server on page load.
refreshStatus();
</script>
