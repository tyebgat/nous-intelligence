<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nous Intelligence</title>
<style>
:root { --yellow: #E4D329; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #12121A;
  color: #12121A;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Background Blurs ── */
.bg-blurs {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.blur-spot {
  position: absolute;
  border-radius: 50%;
  opacity: 0.3;
  filter: blur(120px);
  animation: drift 8s ease-in-out infinite alternate;
}

.blur-spot:nth-child(2) { animation-duration: 10s; animation-delay: -2s; }
.blur-spot:nth-child(3) { animation-duration: 7s; animation-delay: -4s; }
.blur-spot:nth-child(4) { animation-duration: 9s; animation-delay: -1s; }
.blur-spot:nth-child(5) { animation-duration: 11s; animation-delay: -3s; }

@keyframes drift {
  0% { transform: translateY(0); }
  100% { transform: translateY(40px); }
}

/* ── Floating Top Bar ── */
.floating-bar {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  z-index: 100;
  background: #2D2D42;
  border: 1px solid #3A3A4A;
  border-radius: 14px;
  padding: 8px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  backdrop-filter: blur(12px);
}

.floating-bar .bar-title {
  font-size: 15px;
  font-weight: 600;
  color: #deded9;
  letter-spacing: 0.3px;
}

.floating-bar .bar-buttons {
  display: flex;
  gap: 6px;
}

.floating-bar .bar-buttons button {
  background: transparent;
  border: 1px solid rgba(222,222,217,0.15);
  border-radius: 8px;
  padding: 6px;
  cursor: pointer;
  color: #deded9;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.2s;
}

.floating-bar .bar-buttons button:hover {
  border-color: var(--yellow);
}

.floating-bar #btnGithub {
  background: transparent;
  border: none;
  border-radius: 8px;
  padding: 6px;
  cursor: pointer;
  color: #1E1E2A;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s;
}

.floating-bar #btnGithub:hover {
  border: none;
  color: var(--yellow);
}

.floating-bar #btnGithub svg {
  width: 20px;
  height: 20px;
}

.floating-bar .bar-buttons button svg {
  width: 20px;
  height: 20px;
}

/* ── Main Layout ── */
.main {
  display: flex;
  position: relative;
  z-index: 1;
  gap: 20px;
  padding: 68px 20px 20px;
  flex: 1;
  min-height: 0;
}

/* ── Chat Panel ── */
.chat-panel {
  flex: 0 0 auto;
  width: 400px;
  min-width: 280px;
  max-width: 700px;
  background: #1E1E2A;
  border-radius: 16px;
  border: 2px solid #3A3A4A;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.resize-handle {
  position: absolute;
  top: 0;
  right: 0;
  width: 6px;
  height: 100%;
  cursor: ew-resize;
  z-index: 10;
}

.resize-handle::after {
  content: '';
  position: absolute;
  top: 50%;
  right: 1px;
  width: 3px;
  height: 40px;
  background: #3A3A4A;
  border-radius: 2px;
  transform: translateY(-50%);
  transition: background 0.2s;
}

.resize-handle:hover::after,
.resize-handle.active::after {
  background: var(--yellow);
}

.chat-messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
  background: #181825;
}

.chat-messages .placeholder {
  color: #5a5a6a;
  text-align: center;
  margin: auto;
  font-style: italic;
  font-size: 14px;
}

.chat-input-area {
  padding: 12px 16px 16px;
  display: flex;
  gap: 10px;
  border-top: 1px solid #3A3A4A;
}

.chat-input-area input {
  flex: 1;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid #3A3A4A;
  background: #2A2A3A;
  font-size: 14px;
  outline: none;
  color: #deded9;
}

.chat-input-area input::placeholder {
  color: #5a5a6a;
}

.chat-input-area input:focus {
  border-color: var(--yellow);
}

.chat-input-area button {
  background: #3A3A4A;
  border: none;
  border-radius: 10px;
  padding: 10px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.chat-input-area button:hover {
  background: #4A4A5A;
}

.chat-input-area button svg {
  width: 20px;
  height: 20px;
  color: #deded9;
}

/* ── Camera Panel ── */
.camera-panel {
  flex: 1;
  background: #1E1E2A;
  border-radius: 16px;
  border: 2px solid #3A3A4A;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  transition: flex 0.3s, min-width 0.3s, max-width 0.3s, border-color 0.3s;
}

#cameraFeed.contain {
  object-fit: contain;
}

.btn-camera-off {
  opacity: 0.35;
}

#cameraFeed {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

#cameraFeed.active {
  display: block;
}

.camera-placeholder {
  text-align: center;
  color: #555;
}

.camera-placeholder.hidden {
  display: none;
}

.camera-placeholder svg {
  width: 48px;
  height: 48px;
  margin-bottom: 10px;
  opacity: 0.5;
}

.camera-placeholder p {
  font-size: 14px;
}

/* ── Status Dot ── */
.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #e74c3c;
  display: inline-block;
  margin-left: 10px;
  transition: background 0.3s;
}

.status-dot.running {
  background: var(--yellow);
}

/* ── Settings Panel ── */
.settings-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
}

.settings-overlay.open {
  display: flex;
}

.settings-panel {
  background: #1E1E2A;
  border: 1px solid #3A3A4A;
  border-radius: 16px;
  width: 780px;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.settings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid #3A3A4A;
  font-weight: 600;
  font-size: 16px;
  color: #deded9;
}

.settings-header button {
  background: none;
  border: none;
  color: #5a5a6a;
  font-size: 22px;
  cursor: pointer;
}

.settings-header button:hover {
  color: #deded9;
}

.settings-tabs {
  display: flex;
  gap: 4px;
  padding: 12px 16px 0;
  overflow-x: auto;
  flex-shrink: 0;
}

.settings-tabs .tab {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 6px 10px;
  cursor: pointer;
  color: #5a5a6a;
  font-size: 11px;
  white-space: nowrap;
  transition: color 0.2s, border-color 0.2s;
}

.settings-tabs .tab:hover {
  color: #deded9;
}

.settings-tabs .tab.active {
  color: var(--yellow);
  border-bottom-color: var(--yellow);
}

.settings-body {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}

.tab-content {
  display: none;
  flex-direction: column;
  gap: 14px;
}

.tab-content.active {
  display: flex;
}

.tab-content label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: #b0b0ba;
  gap: 12px;
}

.tab-content label input[type="text"],
.tab-content label input[type="number"],
.tab-content label select {
  background: #2A2A3A;
  border: 1px solid #3A3A4A;
  border-radius: 6px;
  padding: 6px 10px;
  color: #deded9;
  font-size: 13px;
  width: 180px;
  outline: none;
}

.tab-content label input[type="text"]:focus,
.tab-content label input[type="number"]:focus,
.tab-content label select:focus {
  border-color: var(--yellow);
}

.tab-content label input[type="checkbox"] {
  accent-color: var(--yellow);
  width: 16px;
  height: 16px;
}

.tab-content label input[type="range"] {
  width: 140px;
  accent-color: var(--yellow);
}

.tab-content label.disabled {
  opacity: 0.35;
  pointer-events: none;
}

.tab-content label input[type="color"] {
  width: 40px;
  height: 30px;
  padding: 0;
  border: 1px solid #3A3A4A;
  border-radius: 6px;
  background: none;
  cursor: pointer;
}

.settings-footer {
  padding: 12px 20px;
  border-top: 1px solid #3A3A4A;
  display: flex;
  justify-content: flex-end;
}

.settings-footer button {
  background: #2ecc71;
  border: none;
  border-radius: 8px;
  padding: 8px 24px;
  font-weight: 600;
  font-size: 14px;
  color: #fff;
  cursor: pointer;
  transition: background 0.2s;
}

.settings-footer button:hover {
  background: #27ae60;
}
</style>
</head>

<script>
// ── Camera Toggle ──
let cameraStream = null;
const btnCamera = document.getElementById('btnCamera');
const cameraSlash = document.getElementById('cameraSlash');

async function startCamera() {
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
    const video = document.getElementById('cameraFeed');
    video.srcObject = cameraStream;
    await video.play();
    video.classList.add('active');
    document.getElementById('cameraPlaceholder').classList.add('hidden');
    btnCamera.style.borderColor = 'var(--yellow)';
    cameraSlash.style.display = 'none';
  } catch (err) {
    console.log('Camera not available:', err.message);
  }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  const video = document.getElementById('cameraFeed');
  video.classList.remove('active');
  video.srcObject = null;
  document.getElementById('cameraPlaceholder').classList.remove('hidden');
  btnCamera.style.borderColor = '';
  cameraSlash.style.display = 'block';
}

btnCamera.addEventListener('click', () => {
  if (cameraStream) { stopCamera(); }
  else { startCamera(); }
});

// ── Accent Color ──
const accentPicker = document.getElementById('accentColor');
accentPicker.addEventListener('input', () => {
  document.documentElement.style.setProperty('--yellow', accentPicker.value);
});

// ── Blur Intensity ──
const blurSlider = document.getElementById('blurIntensity');
const blurSpots = document.querySelectorAll('.blur-spot');
function updateBlur() {
  blurSpots.forEach(spot => { spot.style.filter = `blur(${blurSlider.value}px)`; });
}

// ── Chat Panel Resize ──
const chatPanel = document.getElementById('chatPanel');
const resizeHandle = document.getElementById('resizeHandle');
let isResizing = false;

resizeHandle.addEventListener('mousedown', (e) => {
  isResizing = true;
  document.body.style.cursor = 'ew-resize';
  resizeHandle.classList.add('active');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isResizing) return;
  const rect = chatPanel.parentElement.getBoundingClientRect();
  let newWidth = e.clientX - rect.left;
  newWidth = Math.max(280, Math.min(700, newWidth));
  chatPanel.style.width = newWidth + 'px';
});

document.addEventListener('mouseup', () => {
  if (isResizing) {
    isResizing = false;
    document.body.style.cursor = '';
    resizeHandle.classList.remove('active');
  }
});

// ── Dummy WebSocket function ──
function wsSend(type, payload) {
  console.log(`[WS] type: ${type}`, payload);
  let socket = null;

  function connectWebSocket() {
    socket = new WebSocket('ws://localhost:8000/ws');

    socket.onopen = (event) => {
      console.log('[WS] Conexión establecida con éxito.');
      updateStatusUI('connected');
    };

    socket.onmessage = (event) => {
      console.log('[WS] Mensaje recibido del servidor:', event.data);
      const data = JSON.parse(event.data);
      handleIncomingMessage(data);
    };

    socket.onerror = (error) => {
      console.error('[WS] Error en la conexión:', error);
    };

    socket.onclose = (event) => {
      console.warn('[WS] Conexión cerrada. Intentando reconectar en 3 segundos...');
      updateStatusUI('disconnected');
      
      setTimeout(() => {
        connectWebSocket();
      }, 3000);
    };
  }

  function wsSend(type, payload) {
    if (socket && socket.readyState === WebSocket.OPEN) {
      const messageObject = {
        type: type,
        payload: payload,
        timestamp: Date.now()
      };

      const jsonString = JSON.stringify(messageObject);

      socket.send(jsonString);
      console.log(`[WS Enviado] (${type}):`, payload);
    } else {
      console.error('[WS Error] No se pudo enviar el mensaje: La conexión no está abierta.');
    }
  }

  function updateStatusUI(status) {
    const statusDot = document.getElementById('statusDot');
    if (statusDot) {
      if (status === 'connected') {
        statusDot.style.backgroundColor = '#00ff88';
        statusDot.style.boxShadow = '0 0 8px #00ff88';
      } else {
        statusDot.style.backgroundColor = '#ff4444';
        statusDot.style.boxShadow = '0 0 8px #ff4444';
      }
    }
  }

  function handleIncomingMessage(data) {
    if (data.type === 'chat_response') {
      const msgs = document.getElementById('chatMessages');
      if (msgs) {
        const bubble = document.createElement('div');
        bubble.className = 'msg ai-msg';
        bubble.textContent = data.payload.text;
        msgs.appendChild(bubble);
        msgs.scrollTop = msgs.scrollHeight;
      }
    }
  }

  connectWebSocket();
}

// ── Settings sync ──
let originalSettings = null;

function loadSettings() {
  fetch('/api/settings')
    .then((res) => res.json())
    .then((config) => {
      originalSettings = config;
      document.querySelectorAll('[data-key]').forEach((el) => {
        const key = el.dataset.key;
        if (!(key in config)) return;
        const value = config[key];
        if (el.type === 'checkbox') {
          el.checked = value === true;
        } else {
          el.value = value;
        }
      });
      // Keep accent/blur in sync with saved values (UI-only keys).
      if (config.accent_color) document.getElementById('accentColor').value = config.accent_color;
      if (config.blur_intensity) blurIntensity.value = config.blur_intensity;
      if (config.keep_camera_aspect_ratio) keepAspect.checked = config.keep_camera_aspect_ratio === true;
    })
    .catch((err) => console.error('Failed to load settings', err));
}

function collectChangedSettings() {
  // Only keys that exist in the backend config AND differ get sent on Apply.
  const diff = {};
  document.querySelectorAll('[data-key]').forEach((el) => {
    const key = el.dataset.key;
    if (originalSettings === null || !(key in originalSettings)) return;
    const value = el.type === 'checkbox'
      ? el.checked
      : el.type === 'number'
        ? parseFloat(el.value)
        : el.value;
    if (originalSettings[key] !== value) diff[key] = value;
  });
  return diff;
}

function applySettings() {
  const diff = collectChangedSettings();
  console.log('[POST] /api/settings', diff);
  fetch('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(diff),
  })
    .then((res) => res.json())
    .then((data) => {
      originalSettings = data.config;
      console.log('[POST] settings saved', data.config);
    })
    .catch((err) => console.error('Failed to apply settings', err));
}

const ttsService = document.querySelector('#tab-tts select');
const ttsLabels = document.querySelectorAll('#tab-tts label');

function updateTtsDisabled() {
  const val = ttsService.value;
  ttsLabels.forEach((label, i) => {
    if (i === 0) return;
    if (val === 'gtts' && i === 1) { label.classList.remove('disabled'); }
    else if (val === 'gtts') { label.classList.add('disabled'); }
    else if (val === 'openai' && (i === 2 || i === 3 || i === 4 || i === 5 || i === 6)) { label.classList.add('disabled'); }
    else if (val === 'pockettts' && i === 6) { label.classList.add('disabled'); }
    else { label.classList.remove('disabled'); }
  });
}

  ttsService.addEventListener('change', updateTtsDisabled);

}
