<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nous Intelligence</title>
<style>
:root { --yellow: #E4D329; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #12121A;
  color: #12121A;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Splash Screen ── */
.splash-screen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.6s ease;
}

.splash-screen.hidden {
  opacity: 0;
  pointer-events: none;
}

.splash-screen img {
  width: 55%;
  max-width: 520px;
  animation: splash-pulse 1.2s ease-in-out infinite alternate;
}

@keyframes splash-pulse {
  0% { transform: scale(1); opacity: 0.9; }
  100% { transform: scale(1.04); opacity: 1; }
}

/* ── Background Blurs ── */
.bg-blurs {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.blur-spot {
  position: absolute;
  border-radius: 50%;
  opacity: 0.3;
  filter: blur(120px);
  animation: drift 8s ease-in-out infinite alternate;
}

.blur-spot:nth-child(2) { animation-duration: 10s; animation-delay: -2s; }
.blur-spot:nth-child(3) { animation-duration: 7s; animation-delay: -4s; }
.blur-spot:nth-child(4) { animation-duration: 9s; animation-delay: -1s; }
.blur-spot:nth-child(5) { animation-duration: 11s; animation-delay: -3s; }

@keyframes drift {
  0% { transform: translateY(0); }
  100% { transform: translateY(40px); }
}

/* ── Floating Top Bar ── */
.floating-bar {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  z-index: 100;
  background: #2D2D42;
  border: 1px solid #3A3A4A;
  border-radius: 14px;
  padding: 5px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  backdrop-filter: blur(12px);
}

.floating-bar .bar-logo {
  height: 22px;
  overflow: hidden;
  display: inline-flex;
  align-items: flex-start;
}

.floating-bar .bar-logo img {
  height: 31px;
  width: auto;
  transform: translateY(-1px);
  filter: drop-shadow(0 0 6px rgba(1,120,172,0.35));
}

.floating-bar .bar-buttons {
  display: flex;
  gap: 6px;
}

.floating-bar .bar-buttons button {
  background: transparent;
  border: 1px solid rgba(222,222,217,0.15);
  border-radius: 8px;
  padding: 4px;
  cursor: pointer;
  color: #deded9;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.2s;
}

.floating-bar .bar-buttons button:hover {
  border-color: var(--yellow);
}

.floating-bar .bar-buttons button.active {
  border-color: var(--yellow);
  color: var(--yellow);
}

.floating-bar #btnGithub {
  background: transparent;
  border: none;
  border-radius: 8px;
  padding: 4px;
  cursor: pointer;
  color: #1E1E2A;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s;
}

.floating-bar #btnGithub:hover {
  border: none;
  color: var(--yellow);
}

.floating-bar #btnGithub svg {
  width: 20px;
  height: 20px;
}

.floating-bar .bar-buttons button svg {
  width: 20px;
  height: 20px;
}

/* ── Main Layout ── */
.main {
  display: flex;
  position: relative;
  z-index: 1;
  gap: 20px;
  padding: 68px 20px 20px;
  flex: 1;
  min-height: 0;
}

/* ── Side Stack (chat + terminal) ── */
.side-stack {
  flex: 0 0 auto;
  width: 400px;
  min-width: 280px;
  max-width: 700px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-height: 0;
}

/* ── Chat Panel ── */
.chat-panel {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  background: #1E1E2A;
  border-radius: 16px;
  border: 2px solid #3A3A4A;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.resize-handle {
  position: absolute;
  top: 0;
  right: 0;
  width: 6px;
  height: 100%;
  cursor: ew-resize;
  z-index: 10;
}

.resize-handle::after {
  content: '';
  position: absolute;
  top: 50%;
  right: 1px;
  width: 3px;
  height: 40px;
  background: #3A3A4A;
  border-radius: 2px;
  transform: translateY(-50%);
  transition: background 0.2s;
}

.resize-handle:hover::after,
.resize-handle.active::after {
  background: var(--yellow);
}

.chat-messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
  background: #181825;
}

.chat-messages .placeholder {
  color: #5a5a6a;
  text-align: center;
  margin: auto;
  font-style: italic;
  font-size: 14px;
}

.chat-messages .msg {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.4;
  word-wrap: break-word;
}

.chat-messages .ai-msg {
  align-self: flex-start;
  background: #26263A;
  border: 1px solid #3A3A4A;
  color: #deded9;
  border-radius: 14px 14px 14px 4px;
}

.chat-messages .stage-msg {
  opacity: 0.65;
  font-style: italic;
  background: #22222E;
}

.chat-input-area {
  padding: 12px 16px 16px;
  display: flex;
  gap: 10px;
  border-top: 1px solid #3A3A4A;
}

.chat-input-area input {
  flex: 1;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid #3A3A4A;
  background: #2A2A3A;
  font-size: 14px;
  outline: none;
  color: #deded9;
}

.chat-input-area input::placeholder {
  color: #5a5a6a;
}

.chat-input-area input:focus {
  border-color: var(--yellow);
}

.chat-input-area button {
  background: #3A3A4A;
  border: none;
  border-radius: 10px;
  padding: 10px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.chat-input-area button:hover {
  background: #4A4A5A;
}

.chat-input-area button svg {
  width: 20px;
  height: 20px;
  color: #deded9;
}

/* ── Camera Panel ── */
.camera-panel {
  flex: 1;
  background: #1E1E2A;
  border-radius: 16px;
  border: 2px solid #3A3A4A;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  transition: flex 0.3s, min-width 0.3s, max-width 0.3s, border-color 0.3s;
}

#cameraFeed.contain {
  object-fit: contain;
}

.btn-camera-off {
  opacity: 0.35;
}

#cameraFeed {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

#cameraFeed.active {
  display: block;
}

.camera-placeholder {
  text-align: center;
  color: #555;
}

.camera-placeholder.hidden {
  display: none;
}

.camera-placeholder svg {
  width: 48px;
  height: 48px;
  margin-bottom: 10px;
  opacity: 0.5;
}

.camera-placeholder p {
  font-size: 14px;
}

/* ── Status Dot ── */
.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #e74c3c;
  box-shadow: 0 0 6px #e74c3c;
  display: inline-block;
  margin-left: 10px;
  transition: background 0.3s, box-shadow 0.3s;
}

.status-dot.starting {
  background: var(--yellow);
  box-shadow: 0 0 8px var(--yellow);
}

.status-dot.online {
  background: #00ff88;
  box-shadow: 0 0 8px #00ff88;
}

/* ── Settings Panel ── */
.settings-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
}

.settings-overlay.open {
  display: flex;
}

.settings-panel {
  background: #1E1E2A;
  border: 1px solid #3A3A4A;
  border-radius: 16px;
  width: 780px;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.settings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid #3A3A4A;
  font-weight: 600;
  font-size: 16px;
  color: #deded9;
}

.settings-header button {
  background: none;
  border: none;
  color: #5a5a6a;
  font-size: 22px;
  cursor: pointer;
}

.settings-header button:hover {
  color: #deded9;
}

.settings-tabs {
  display: flex;
  gap: 4px;
  padding: 12px 16px 0;
  overflow-x: auto;
  flex-shrink: 0;
}

.settings-tabs .tab {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 6px 10px;
  cursor: pointer;
  color: #5a5a6a;
  font-size: 11px;
  white-space: nowrap;
  transition: color 0.2s, border-color 0.2s;
}

.settings-tabs .tab:hover {
  color: #deded9;
}

.settings-tabs .tab.active {
  color: var(--yellow);
  border-bottom-color: var(--yellow);
}

.settings-body {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}

.tab-content {
  display: none;
  flex-direction: column;
  gap: 14px;
}

.tab-content.active {
  display: flex;
}

.tab-content label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: #b0b0ba;
  gap: 12px;
}

.tab-content label input[type="text"],
.tab-content label input[type="number"],
.tab-content label select {
  background: #2A2A3A;
  border: 1px solid #3A3A4A;
  border-radius: 6px;
  padding: 6px 10px;
  color: #deded9;
  font-size: 13px;
  width: 180px;
  outline: none;
}

.tab-content label input[type="text"]:focus,
.tab-content label input[type="number"]:focus,
.tab-content label select:focus {
  border-color: var(--yellow);
}

.tab-content label input[type="checkbox"] {
  accent-color: var(--yellow);
  width: 16px;
  height: 16px;
}

.tab-content label input[type="range"] {
  width: 140px;
  accent-color: var(--yellow);
}

.tab-content label.disabled {
  opacity: 0.35;
  pointer-events: none;
}

.tab-content label input[type="color"] {
  width: 40px;
  height: 30px;
  padding: 0;
  border: 1px solid #3A3A4A;
  border-radius: 6px;
  background: none;
  cursor: pointer;
}

.tab-content label.textarea-field {
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
}

.tab-content label.textarea-field textarea {
  width: 100%;
  height: 120px;
  background: #2A2A3A;
  border: 1px solid #3A3A4A;
  border-radius: 6px;
  padding: 8px 10px;
  color: #deded9;
  font-size: 13px;
  font-family: Consolas, Menlo, monospace;
  resize: vertical;
  outline: none;
}

.tab-content label.textarea-field textarea:focus {
  border-color: var(--yellow);
}

.settings-footer {
  padding: 12px 20px;
  border-top: 1px solid #3A3A4A;
  display: flex;
  justify-content: flex-end;
}

.settings-footer button {
  background: #2ecc71;
  border: none;
  border-radius: 8px;
  padding: 8px 24px;
  font-weight: 600;
  font-size: 14px;
  color: #fff;
  cursor: pointer;
  transition: background 0.2s;
}

.settings-footer button:hover {
  background: #27ae60;
}

/* ── Toast Notification ── */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 600;
  background: #12121A;
  border: 1px solid #2ecc71;
  color: #2ecc71;
  padding: 12px 22px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 14px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}
/* ── Terminal Panel ── */
.terminal {
  flex: 0 0 auto;
  height: 220px;
  width: 100%;
  background: #0d0d12;
  border: 1px solid #3A3A4A;
  border-radius: 12px;
  display: none;
  flex-direction: column;
  overflow: hidden;
}

.terminal.visible {
  display: flex;
}

.terminal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: #1E1E2A;
  border-bottom: 1px solid #3A3A4A;
  color: #deded9;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
}

.terminal-header button {
  background: none;
  border: 1px solid rgba(222,222,217,0.15);
  border-radius: 6px;
  color: #deded9;
  padding: 2px 8px;
  cursor: pointer;
  font-size: 12px;
}

.terminal-header button:hover {
  border-color: var(--yellow);
}

.terminal-log {
  flex: 1;
  overflow-y: auto;
  padding: 10px 14px;
  font-family: Consolas, Menlo, monospace;
  font-size: 12px;
  line-height: 1.5;
  color: #a8e6a3;
  white-space: pre-wrap;
  word-break: break-all;
}

/* ── Init Overlay ── */
.init-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 250;
  display: none;
  align-items: center;
  justify-content: center;
}

.init-overlay.open {
  display: flex;
}

.init-panel {
  background: #1E1E2A;
  border: 1px solid #3A3A4A;
  border-radius: 16px;
  width: 640px;
  max-width: 92vw;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.init-panel h3 {
  color: #deded9;
  font-size: 15px;
  font-weight: 600;
}

.init-console {
  background: #0d0d12;
  border: 1px solid #3A3A4A;
  border-radius: 10px;
  height: 320px;
  overflow-y: auto;
  padding: 12px 14px;
  font-family: Consolas, Menlo, monospace;
  font-size: 12px;
  line-height: 1.6;
  color: #c9d1d9;
  white-space: pre-wrap;
  word-break: break-all;
}

.init-actions {
  display: flex;
  justify-content: flex-end;
}

.init-ok {
  display: none;
  background: #2ecc71;
  border: none;
  color: #0d0d12;
  font-weight: 600;
  padding: 10px 26px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
}

.init-ok.visible {
  display: inline-block;
}

.init-ok:hover {
  background: #27ae60;
}
</style>
</head>
<body>

<div class="splash-screen" id="splashScreen">
  <img src="/gui/Nous intelligence.png" alt="Nous Intelligence"/>
</div>

<div class="floating-bar">
  <span class="status-dot" id="statusDot"></span>
  <span class="bar-logo" title="Nous Intelligence">
    <img src="/gui/Nous intelligence only text.plain.svg" alt="Nous Intelligence"/>
  </span>
  <div class="bar-buttons">
    <button id="btnStart" title="Start">
      <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
    </button>
    <button id="btnStop" title="Stop">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
    </button>
    <button id="btnCamera" title="Camera">
      <span style="position:relative;display:flex;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <svg id="cameraSlash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="position:absolute;inset:0;">
          <line x1="4" y1="4" x2="20" y2="20"/>
        </svg>
      </span>
    </button>
    <button id="btnTerminal" title="Terminal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 17 10 11 4 5"/>
        <line x1="12" y1="19" x2="20" y2="19"/>
      </svg>
    </button>
    <button id="btnSettings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
  <button id="btnGithub" title="GitHub" style="margin-left:auto;">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
    </svg>
  </button>
</div>

<div class="bg-blurs">
  <div class="blur-spot" style="top:10%;left:-15%;width:500px;height:500px;background:#0D0B61;"></div>
  <div class="blur-spot" style="bottom:5%;left:-10%;width:400px;height:400px;background:#0D0B61;"></div>
  <div class="blur-spot" style="top:20%;right:-12%;width:450px;height:450px;background:#E4D329;"></div>
  <div class="blur-spot" style="bottom:30%;right:-8%;width:350px;height:350px;background:#E4D329;"></div>
  <div class="blur-spot" style="top:50%;left:50%;translate:-50% -50%;width:300px;height:300px;background:#478B8D;"></div>
</div>
<div class="main">
  <div class="side-stack" id="sideStack">
    <!-- Chat Panel -->
    <div class="chat-panel" id="chatPanel">
      <div class="resize-handle" id="resizeHandle"></div>
      <div class="chat-messages" id="chatMessages">
        <div class="placeholder">Start the service and send a message to begin chatting.</div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Type a message..." />
        <button id="btnSend">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Terminal Panel -->
    <div class="terminal" id="terminalPanel">
      <div class="terminal-header">
        <span>Terminal</span>
        <button id="terminalClear">Clear</button>
      </div>
      <div class="terminal-log" id="terminalLog"></div>
    </div>
  </div>

  <!-- Camera Panel -->
  <div class="camera-panel" id="cameraPanel">

// ── Camera Toggle ──
let cameraStream = null;
const btnCamera = document.getElementById('btnCamera');
const cameraSlash = document.getElementById('cameraSlash');

async function startCamera() {
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
    const video = document.getElementById('cameraFeed');
    video.srcObject = cameraStream;
    await video.play();
    video.classList.add('active');
    document.getElementById('cameraPlaceholder').classList.add('hidden');
    btnCamera.style.borderColor = 'var(--yellow)';
    cameraSlash.style.display = 'none';
  } catch (err) {
    console.log('Camera not available:', err.message);
  }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  const video = document.getElementById('cameraFeed');
  video.classList.remove('active');
  video.srcObject = null;
  document.getElementById('cameraPlaceholder').classList.remove('hidden');
  btnCamera.style.borderColor = '';
  cameraSlash.style.display = 'block';
}

btnCamera.addEventListener('click', () => {
  if (cameraStream) { stopCamera(); }
  else { startCamera(); }
});

resizeHandle.addEventListener('mousedown', (e) => {
  isResizing = true;
  document.body.style.cursor = 'ew-resize';
  resizeHandle.classList.add('active');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isResizing) return;
  const rect = sideStack.getBoundingClientRect();

  newWidth = Math.max(280, Math.min(700, newWidth));

// ── WebSocket ──
let socket = null;
let reconnectTimer = null;

function wsUrl() {
  const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${window.location.host}/ws`;
}

function connectWebSocket() {
  if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
    return;
  }
  socket = new WebSocket(wsUrl());

  socket.onopen = () => {
    console.log('[WS] Conexión establecida con éxito.');
  };

  socket.onmessage = (event) => {
    console.log('[WS] Mensaje recibido del servidor:', event.data);
    try {
      const data = JSON.parse(event.data);
      handleIncomingMessage(data);
    } catch (e) {
      console.error('[WS] No se pudo parsear el mensaje:', e);
    }
  };

  socket.onerror = (error) => {
    console.error('[WS] Error en la conexión:', error);
  };

  socket.onclose = () => {
    console.warn('[WS] Conexión cerrada. Intentando reconectar en 3 segundos...');
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connectWebSocket, 3000);
  };
}

function wsSend(type, payload) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    const messageObject = {
      type: type,
      payload: payload,
      timestamp: Date.now()
    };
    socket.send(JSON.stringify(messageObject));
    console.log(`[WS Enviado] (${type}):`, payload);
  } else {
    console.error('[WS Error] No se pudo enviar el mensaje: La conexión no está abierta.');
    connectWebSocket();
  }
}

function setServiceStatus(status) {
  // status: 'off' (red) | 'starting' (yellow) | 'online' (green)
  const statusDot = document.getElementById('statusDot');
  if (!statusDot) return;
  statusDot.classList.remove('starting', 'online');
  if (status === 'starting') statusDot.classList.add('starting');
  else if (status === 'online') statusDot.classList.add('online');
}

// ── Init panel / terminal logging ──
const initOverlay = document.getElementById('initOverlay');
const initConsole = document.getElementById('initConsole');
const terminalLog = document.getElementById('terminalLog');

// Renders ANSI color codes (\x1b[31m, etc.) as colored spans for the web terminal.
const ANSI_COLORS = {
  30: '#000000', 31: '#ff5555', 32: '#50fa7b', 33: '#f1fa8c',
  34: '#8be9fd', 35: '#ff79c6', 36: '#4ad2d2', 37: '#f8f8f2',
  90: '#777777', 91: '#ff6e6e', 92: '#69ff94', 93: '#ffffa5',
  94: '#d6acff', 95: '#ff92df', 96: '#a4ffff', 97: '#ffffff'
};

function ansiToHtml(line) {
  line = String(line).replace(/\r/g, '');
  const escaped = line
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const re = /\x1b\[([0-9;]*)m/g;
  let out = '';
  let cur = null;
  let last = 0;
  let m;
  while ((m = re.exec(escaped)) !== null) {
    out += escaped.slice(last, m.index);
    last = re.lastIndex;
    const seq = m[1] ? m[1].split(';') : ['0'];
    let next = cur;
    for (const c of seq) {
      if (c === '0' || c === '') next = null;
      else if (c === '38') next = '#FFA500'; // orange used by the codebase
      else if (ANSI_COLORS[c]) next = ANSI_COLORS[c];
    }
    if (next !== cur) {
      if (cur) out += '</span>';
      if (next) out += `<span style="color:${next};">`;
      cur = next;
    }
  }
  out += escaped.slice(last);
  if (cur) out += '</span>';
  return out;
}

function appendLog(line) {
  const raw = String(line);
  const html = ansiToHtml(raw);
  if (terminalLog) {
    terminalLog.innerHTML += html + '\n';
    terminalLog.scrollTop = terminalLog.scrollHeight;
  }
  if (initOverlay && initOverlay.classList.contains('open') && initConsole) {
    initConsole.innerHTML += html + '\n';
    initConsole.scrollTop = initConsole.scrollHeight;
  }
  if (raw.indexOf('All requested AI services are online') !== -1) {
    showInitOk();
  }
}

function openInitPanel() {
  if (initConsole) initConsole.textContent = '';
  const ok = document.getElementById('initOk');
  if (ok) ok.classList.remove('visible');
  initOverlay.classList.add('open');
}

function showInitOk() {
  const ok = document.getElementById('initOk');
  if (ok) ok.classList.add('visible');
}

function closeInitPanel() {
  initOverlay.classList.remove('open');
}

// ── Splash screen ──
const splashScreen = document.getElementById('splashScreen');

function hideSplash() {
  if (!splashScreen || splashScreen.classList.contains('hidden')) return;
  splashScreen.classList.add('hidden');
  setTimeout(() => { splashScreen.style.display = 'none'; }, 700);
}

(function playSplash() {
  const audio = new Audio('/gui/Splash-screen.mp3');
  let hidden = false;
  const hideOnce = () => {
    if (hidden) return;
    hidden = true;
    hideSplash();
  };
  audio.addEventListener('ended', hideOnce);
  audio.addEventListener('error', hideOnce);
  audio.play().catch(() => {
    // Autoplay blocked: keep the splash visible for a moment, then move on.
    setTimeout(hideOnce, 3000);
  });
  // Safety net so the splash never lingers forever.
  setTimeout(hideOnce, 15000);
})();

if (splashScreen) {
  splashScreen.addEventListener('click', hideSplash);
}

let stagedMsg = null;

function getOrCreateStagedBubble() {
  const msgs = document.getElementById('chatMessages');
  if (!msgs) return null;
  if (stagedMsg && stagedMsg.isConnected) return stagedMsg;
  const bubble = document.createElement('div');
  bubble.className = 'msg ai-msg stage-msg';
  bubble.textContent = '...';
  msgs.appendChild(bubble);
  msgs.scrollTop = msgs.scrollHeight;
  stagedMsg = bubble;
  return bubble;
}

function handleIncomingMessage(data) {
  if (data.type === 'chat_stage') {
    // Temporary feedback bubble that gets replaced once the AI is done.
    const bubble = getOrCreateStagedBubble();
    if (bubble) bubble.textContent = data.payload.text;
  } else if (data.type === 'chat_response') {
    const msgs = document.getElementById('chatMessages');
    if (msgs) {
      if (stagedMsg && stagedMsg.isConnected) {
        // Replace the temporary stage bubble with the real answer.
        stagedMsg.textContent = data.payload.text;
        stagedMsg.classList.remove('stage-msg');
        stagedMsg = null;
      } else {
        const bubble = document.createElement('div');
        bubble.className = 'msg ai-msg';
        bubble.textContent = data.payload.text;
        msgs.appendChild(bubble);
      }
      msgs.scrollTop = msgs.scrollHeight;
    }
  } else if (data.type === 'log') {
    // Server/uvicorn print forwarded to the init console and terminal.
    appendLog(data.payload.line);
  } else if (data.type === 'status_update') {
    setServiceStatus(data.payload.running === true ? 'online' : 'off');
    // Init finished -> let the user close the panel.
    if (data.payload.running === true) showInitOk();
  }
}

connectWebSocket();

// ── Settings sync ──
let originalSettings = null;

function loadSettings() {
  fetch('/api/settings')
    .then((res) => res.json())
    .then((config) => {
      originalSettings = config;
      document.querySelectorAll('[data-key]').forEach((el) => {
        const key = el.dataset.key;
        if (!(key in config)) return;
        const value = config[key];
        if (el.type === 'checkbox') {
          el.checked = value === true;
        } else {
          el.value = value;
        }
      });
      // Keep accent/blur in sync with saved values (UI-only keys).
      if (config.accent_color) document.getElementById('accentColor').value = config.accent_color;
      if (config.blur_intensity) blurIntensity.value = config.blur_intensity;
      if (config.keep_camera_aspect_ratio) keepAspect.checked = config.keep_camera_aspect_ratio === true;
    })
    .catch((err) => console.error('Failed to load settings', err));
}

// Load the editable text files (personality, TTS instructions, voice design).
function loadTextFiles() {
  document.querySelectorAll('[data-file]').forEach((el) => {
    const name = el.dataset.file;
    fetch('/api/text/' + name)
      .then((res) => res.json())
      .then((data) => { el.value = data.text || ''; })
      .catch((err) => console.error('Failed to load text file', name, err));
  });
}

function saveTextFiles() {
  document.querySelectorAll('[data-file]').forEach((el) => {
    const name = el.dataset.file;
    fetch('/api/text/' + name, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: el.value }),
    }).catch((err) => console.error('Failed to save text file', name, err));
  });
}

// ── Settings applied toast ──
let toastTimer = null;

function showToast() {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  try {
    new Audio('/gui/notif.mp3').play();
  } catch (e) { /* audio not available */ }
}

function collectChangedSettings() {
  // Only keys that exist in the backend config AND differ get sent on Apply.
  const diff = {};
  document.querySelectorAll('[data-key]').forEach((el) => {
    const key = el.dataset.key;
    if (originalSettings === null || !(key in originalSettings)) return;
    const value = el.type === 'checkbox'
      ? el.checked
      : el.type === 'number'
        ? parseFloat(el.value)
        : el.value;
    if (originalSettings[key] !== value) diff[key] = value;
  });
  return diff;
}

function applySettings() {
  const diff = collectChangedSettings();
  console.log('[POST] /api/settings', diff);
  fetch('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(diff),
  })
    .then((res) => res.json())
    .then((data) => {
      originalSettings = data.config;
      console.log('[POST] settings saved', data.config);
    })
    .catch((err) => console.error('Failed to apply settings', err));
}

function updateTtsDisabled() {
  const val = ttsService.value;
  ttsLabels.forEach((label, i) => {
    if (i === 0) return;
    if (val === 'gtts' && i === 1) { label.classList.remove('disabled'); }
    else if (val === 'gtts') { label.classList.add('disabled'); }
    else if (val === 'openai' && (i === 2 || i === 3 || i === 4 || i === 5 || i === 6)) { label.classList.add('disabled'); }
    else if (val === 'pockettts' && i === 6) { label.classList.add('disabled'); }
    else { label.classList.remove('disabled'); }
  });
}

  ttsService.addEventListener('change', updateTtsDisabled);

}

document.getElementById('btnSend').addEventListener('click', () => {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;

  console.log(`[WS] chat message: "${msg}"`);
  wsSend('chat', { message: msg });

  const msgs = document.getElementById('chatMessages');
  msgs.querySelector('.placeholder')?.remove();

  const bubble = document.createElement('div');
  bubble.style.cssText = 'align-self:flex-end;background:#12121A;color:#deded9;padding:10px 14px;border-radius:14px 14px 4px 14px;max-width:80%;word-wrap:break-word;font-size:14px;';
  bubble.textContent = msg;
  msgs.appendChild(bubble);
  msgs.scrollTop = msgs.scrollHeight;

  input.value = '';
});

document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('btnSend').click();
});

// Set the status dot from the server on page load.
refreshStatus();
</script>

</body>
</html>
